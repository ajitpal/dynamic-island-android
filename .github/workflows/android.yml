name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Commits made on Windows can drop the executable bit on gradlew.
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build, unit tests & lint (island + SDK + all modules)
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            modules/*/build/outputs/apk/debug/*.apk
