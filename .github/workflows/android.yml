name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  docs:
    name: Docs are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README and website match docs/features.json
        run: python3 tools/gen_docs.py --check
      - name: Versions, changelog, roadmap and screenshots are consistent
        run: python3 tools/check_release.py
      - name: Module catalog and approved-certificate list match catalog/modules
        run: python3 tools/gen_catalog.py --check

  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Commits made on Windows can drop the executable bit on gradlew.
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build, unit tests & lint (island + SDK + all modules)
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      # App screens are rendered from code; this fails when a screen changed without
      # re-recording (./gradlew :app:testDebugUnitTest :modules:updater:testDebugUnitTest :modules:ai:testDebugUnitTest :modules:voice:testDebugUnitTest :modules:speech:testDebugUnitTest -Pscreenshots=record).
      # Non-blocking for now, until it has proven stable across runners.
      - name: Screenshots match docs/screenshots/app
        id: shots
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest :modules:updater:testDebugUnitTest :modules:ai:testDebugUnitTest :modules:voice:testDebugUnitTest :modules:speech:testDebugUnitTest -Pscreenshots=verify --no-daemon
      - if: steps.shots.outcome == 'failure'
        run: echo "::warning::App screenshots differ from docs/screenshots/app. Re-record them with -Pscreenshots=record."
      - if: steps.shots.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            docs/screenshots/app/*_compare.png
            docs/screenshots/app/*_actual.png
            app/build/outputs/roborazzi/
      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            modules/*/build/outputs/apk/debug/*.apk
