name: Release

# Push a tag like v1.9.0 to build every APK, sign it with the release key from repository secrets,
# and publish a GitHub release whose notes come from CHANGELOG.md.
# Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see docs/RELEASING.md).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check docs before releasing
        run: python3 tools/gen_docs.py --check && python3 tools/check_release.py
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing. Modules only trust a release-signed island, so an unsigned release is not published. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build signed APKs
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APKs and release notes
        run: python3 tools/collect_release.py "${GITHUB_REF_NAME#v}" dist
      - name: Verify the signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          for f in dist/*.apk; do $APKSIGNER verify --print-certs "$f" | grep -q 12178c6a653dd8e19c2414b0f4375270706820c14b0fc42bc5137c44d5416501 || { echo "::error::$f is not signed with the release key"; exit 1; }; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "Dynamic Island $GITHUB_REF_NAME" --notes-file dist/NOTES.md
      - name: Remove the key from the runner
        if: always()
        run: rm -f release.jks keystore.properties
