name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: phone
    attributes: { label: Phone model + Android version }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: diag
    attributes: { label: Diagnostics, description: Paste or attach the Diagnostics card from the bottom of the app }
